services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Host "db": es el nombre del servicio de PostgreSQL de este mismo archivo.
      DATABASE_URL: postgresql+psycopg://clinic:clinic@db:5432/clinic
      # Clave de desarrollo; se sustituye por la de .env en el despliegue interno.
      JWT_SECRET: ${JWT_SECRET:-clave-de-desarrollo-local-cambiar-en-produccion}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    volumes:
      - clinic-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  clinic-db-data:
